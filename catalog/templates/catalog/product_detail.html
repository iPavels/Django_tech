{% extends "catalog/base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row">

        <div class="col-lg-6 text-center">

            {% if product.image %}
                <img
                    src="{{ product.image.url }}"
                    class="img-fluid"
                    alt="{{ product.name }}"
                >
            {% endif %}

        </div>

        <div class="col-lg-6">

            <h1 class="display-5">
                {{ product.name }}
            </h1>

            <p class="lead">
                {{ product.description }}
            </p>

            <h2 class="mb-4">
                {{ product.price }} ₽
            </h2>

            <a
                href="{% url 'catalog:home' %}"
                class="btn btn-outline-primary"
            >
                ← Вернуться в каталог
            </a>

        </div>

    </div>

</div>

{% endblock %}
