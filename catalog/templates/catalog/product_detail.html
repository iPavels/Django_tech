{% extends "catalog/base.html" %}

{% block title %} {{ product.name }} {% endblock %}

{% block content %}

<h1>{{ product.name }}</h1>

{% if product.image %}
    <img
        src="{{ product.image.url }}"
        alt="{{ product.name }}"
        width="400"
    >
{% endif %}

<p>{{ product.description }}</p>

<p>
    Цена: {{ product.price }} ₽
</p>

<a href="{% url 'catalog:home' %}">
    ← Вернуться в каталог
</a>

{% endblock %}
